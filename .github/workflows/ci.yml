name: CI

on:
  push:

jobs:
  test:
    name: Lint, migrations and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Provide a throw-away SECRET_KEY
        # settings.py has no fallback key, so the test run needs one.  It is
        # generated here rather than committed, and is never reused anywhere.
        run: |
          echo "SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"

      - name: Lint with ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run the test suite with coverage
        run: |
          coverage run manage.py test
          coverage report --show-missing
